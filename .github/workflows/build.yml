name: Clang Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build for Linux/macOS
      if: matrix.os != 'windows-latest'
      run: |
        clang src/*.c -Iinclude -o school_manager

    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: |
        # Create an empty strings.h file inside the include folder so Windows doesn't crash
        New-Item -Path "include\strings.h" -ItemType File -Force
        
        # Compile with the macro replacements and silence the safe scanf warnings
        clang src/*.c -Iinclude -Dstrcasecmp=_stricmp -Dstrncasecmp=_strnicmp -D_CRT_SECURE_NO_WARNINGS -o school_manager.exe


    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-manager-${{ matrix.os }}
        path: |
          school_manager
          school_manager.exe
        if-no-files-found: ignore
